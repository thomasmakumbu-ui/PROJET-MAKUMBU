<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yohann Mavoungou — FINAPUI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --navy-deep:#16233F;
  --navy-mid:#24406B;
  --steel:#4E8FD9;
  --steel-soft:#DCE9FA;
  --bg:#F3F6FA;
  --ink-muted:#5B6B82;
  --white:#FFFFFF;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 15% 10%, rgba(78,143,217,0.10), transparent 45%),
    var(--bg);
  font-family:'Inter', sans-serif;
  padding:32px 16px;
}

.card{
  position:relative;
  width:340px;
  background:var(--white);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(22,35,63,0.35), 0 2px 8px rgba(22,35,63,0.08);
  animation:rise 0.7s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes rise{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

/* ---- Header: logo ---- */
.logo-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 24px 18px 24px;
}
.logo-row img{ height:20px; width:auto; display:block; }
.tag{
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--ink-muted);
  font-weight:600;
}

/* ---- Photo ---- */
.photo-wrap{
  position:relative;
  width:100%;
  height:220px;
  overflow:hidden;
  background:var(--navy-deep);
}
.photo-wrap img{
  width:100%; height:100%;
  object-fit:cover;
  object-position:50% 20%;
  display:block;
}
.photo-fade{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(22,35,63,0) 55%, rgba(22,35,63,0.85) 100%);
}

/* ---- Identity block, overlapping photo bottom ---- */
.identity{
  padding:18px 24px 4px 24px;
}
.name{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:24px;
  color:var(--navy-deep);
  line-height:1.15;
}
.role{
  margin-top:5px;
  font-size:13px;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--steel);
}
.company-line{
  margin-top:10px;
  font-size:12px;
  color:var(--ink-muted);
  line-height:1.5;
}
.company-line b{ color:var(--navy-mid); font-weight:600; }

/* ---- Divider ---- */
.divider{
  margin:18px 24px 0 24px;
  height:1px;
  background:linear-gradient(90deg, var(--steel-soft), transparent);
}

/* ---- Actions ---- */
.actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:18px 24px 24px 24px;
}

.action{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  border-radius:12px;
  text-decoration:none;
  border:1px solid transparent;
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.action:active{ transform:scale(0.98); }

.action.primary{
  background:var(--navy-deep);
  color:var(--white);
}
.action.primary:hover{
  box-shadow:0 8px 18px -8px rgba(22,35,63,0.55);
}

.action.secondary{
  background:var(--white);
  border-color:var(--steel-soft);
  color:var(--navy-deep);
}
.action.secondary:hover{
  border-color:var(--steel);
  box-shadow:0 8px 18px -8px rgba(78,143,217,0.35);
}

.icon{
  width:34px; height:34px;
  border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.action.primary .icon{ background:rgba(255,255,255,0.14); }
.action.secondary .icon{ background:var(--steel-soft); }

.icon svg{ width:16px; height:16px; }
.action.primary .icon svg{ stroke:var(--white); }
.action.secondary .icon svg{ stroke:var(--steel); }

.action-text{ display:flex; flex-direction:column; gap:1px; }
.action-label{ font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.65; font-weight:600; }
.action-value{ font-size:13.5px; font-weight:600; }

/* ---- Footer motto ---- */
.footer{
  text-align:center;
  padding:0 24px 22px 24px;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.footer span{ color:var(--steel); }

@media (max-width:380px){
  .card{ width:100%; max-width:340px; }
}
</style>
